<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro Programa</title>
    <Style>
        Body {
            Background-color:  #555555;
            color: white;
            font: normal 25pt arial;       
        }
        h1 {
            color: #FFff00; /* Comentário em CSS */
        }
    </Style>
</head>
<body>
    <h1>Olá Mundo</h1> <!-- Isso é um comentário -->
    <p>Já me livrei da maldição</p>
    <script>
       var n1 = Number.parseInt(window.prompt('Digite um número:')); // string
       var n2 = Number.parseInt(window.prompt('Digite outro número:')); // string
       var s = n1 + n2; 
       window.alert(`A soma entre ${n1} e ${n2} é igual a ${s}`); // Concatenação
       // (number + number) para Adição
       // (string + string) para Concatenação
       
    </script>
</body>
</html>
